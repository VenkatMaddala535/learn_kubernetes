apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-mongo-deployment
  namespace : my-namespace
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app:  mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: my-mongodb-conatiner
          image: mongo
          ports:
            -  containerPort: 27017

---
apiVersion: v1
kind: Service
metadata: 
  name: my-mongo-service
  labels:
    app: mongodb
spec:
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017  
  selector: 
    app: mongodb

  

     